<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'Accueil du Tournoi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="referee.js"></script>
</head>
<body>
<header>
    <h1 class="highlight">Echec et Mat</h1>
</header>
<nav>
    <ul>
        <li><a href="home.html">Accueil</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>
<section>
    <aside>
        <ul id="referee-list">
            <li class="title">Liste des arbitres enregistrés</li>
        </ul>
    </aside>
    <form id="referee-form" action="#" method="post">
        <h2 class="highlight">Enregistrer des arbitres</h2>
        <div class="input-group">
            <label for="lastname">Nom :</label>
            <input type="text" id="lastname" name="lastname" placeholder="Entrez votre nom" required>
        </div>
        <div class="input-group">
            <label for="firstname">Prénom :</label>
            <input type="text" id="firstname" name="firstname" placeholder="Entrez votre prénom" required>
        </div>
        <div class="input-group">
            <label for="country">Nation :</label>
            <select id="country" name="country">
                <option value="AM">Arménie</option>
                <option value="BE">Belgique</option>
                <option value="CN">Chine</option>
                <option value="DE">Allemagne</option>
                <option value="FR" selected>France</option>
                <option value="GE">Géorgie</option>
                <option value="IO">Indien</option>
                <option value="NO">Norvège</option>
                <option value="PL">Pologne</option>
                <option value="RU">Russie</option>
                <option value="SE">Suède</option>
                <option value="UA">Ukraine</option>
                <option value="US">États-Unis</option>
                <option value="UZ">Ouzbékistan</option>
            </select>
        </div>
        <div class="input-group">
            <label for="level">Niveau :</label>
            <select id="level" name="level">
                <option value="plateau">Plateau</option>
                <option value="control">Controleur</option>
            </select>
        </div>
        <button type="submit">Enregistrer arbitre</button>
    </form>
</section>
<footer>
    <p>&copy; 2024 Jeu d'Échecs. Tous droits réservés.</p>
    <p>
        <a href="http://jigsaw.w3.org/css-validator/check/referer">
            <img style="border:0;width:88px;height:31px"
                 src="http://jigsaw.w3.org/css-validator/images/vcss"
                 alt="CSS Valide !">
        </a>
    </p>
</footer>
</body>
</html>
