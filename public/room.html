<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrer une Salle de Match</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="room.js"></script>
</head>
<body>
<header>
    <h1 class="highlight">Echec et Mat</h1>
</header>
<nav>
    <ul>
        <li><a href="home.html">Accueil</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>
<section class="room-form">
    <aside>
        <ul id="room-list">
            <li class="title">Liste des salles</li>
        </ul>
    </aside>
    <form id="room-form" action="#" method="post">
        <h2 class="highlight">Enregistrer des salles</h2>
        <div class="input-group">
            <label for="roomName">Nom de la Salle :</label>
            <input type="text" id="roomName" name="roomName" placeholder="Entrez le nom de la salle" required>
        </div>
        <div class="input-group">
            <label for="location">Emplacement :</label>
            <input type="text" id="location" name="location" placeholder="Entrez l'emplacement de la salle" required>
        </div>
        <div class="input-group">
            <label for="capacity">Capacité :</label>
            <input type="number" id="capacity" name="capacity" placeholder="Entrez la capacité de la salle" required>
        </div>
        <button type="submit">Enregistrer la salle</button>
    </form>
</section>
<footer>

                 alt="CSS Valide !">
        </a>
    </p>
</footer>
</body>
</html>
