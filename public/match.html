<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrer un Match</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="match.js"></script>
</head>
<body>
<header>
    <h1 class="highlight">Echec et Mat</h1>
</header>
<nav>
    <ul>
        <li><a href="home.html">Accueil</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>
<section class="match-form">
    <aside>
        <ul id="match-list">
            <li class="title">Liste des matchs</li>
        </ul>
    </aside>
    <form id="match-form" action="#" method="post">
        <h2 class="highlight">Planifier des matchs</h2>
        <div class="input-group">
            <h3>Choix du tournoi :</h3>
            <label for="H"></label><input type="radio" id="H" name="sex" value="Messieurs" onclick="setPlayers('H')" checked>
            Simple Homme
            <label for="F"></label><input type="radio" id="F" name="sex" value="Mesdames" onclick="setPlayers('F')">
            Simple Femme
        </div>
        <div class="input-group">
            <label for="player1">Joueur Blanc :</label>
            <select id="player1" name="player1" required>
            </select>
        </div>
        <div class="input-group">
            <label for="player2">Joueur Noir :</label>
            <select id="player2" name="player2" required>
            </select>
        </div>
        <div class="input-group">
            <label for="referee">Arbitre :</label>
            <select id="referee" name="referee" required>
            </select>
        </div>
        <div class="input-group">
            <label for="room">Salle :</label>
            <select id="room" name="room" required>
            </select>
        </div>
        <div class="input-group">
            <label for="date">Date du Match :</label>
            <input type="date" id="date" name="date" required>
        </div>
        <button type="submit">Enregistrer le match</button>
    </form>
</section>
<footer>
    <p>&copy; 2024 Jeu d'Échecs. Tous droits réservés.</p>

                 src="http://jigsaw.w3.org/css-validator/images/vcss"
                 alt="CSS Valide !">
        </a>
    </p>
</footer>
</body>
</html>
